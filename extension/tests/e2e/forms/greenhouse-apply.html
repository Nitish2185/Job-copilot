<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture: Greenhouse-style application</title>
  </head>
  <body>
    <h1>Backend Engineer at Fixture Corp</h1>
    <!-- Structure modelled on job-boards.greenhouse.io forms; no personal data. -->
    <form
      method="get"
      action="/greenhouse/confirmation.html"
      id="application-form"
      class="application--form"
    >
      <div>
        <label for="first_name">First Name *</label
        ><input id="first_name" name="first_name" required />
      </div>
      <div>
        <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required />
      </div>
      <div>
        <label for="email">Email *</label><input id="email" name="email" type="email" required />
      </div>
      <div><label for="phone">Phone</label><input id="phone" name="phone" type="tel" /></div>
      <div>
        <label for="resume">Resume/CV *</label>
        <input
          id="resume"
          class="visually-hidden"
          type="file"
          accept=".pdf"
          required
          style="position: absolute; opacity: 0; width: 1px; height: 1px"
        />
        <span id="resume-name"></span>
      </div>
      <div class="g-recaptcha" data-size="invisible" data-sitekey="fixture"></div>
      <button type="submit" class="btn btn--pill">Submit application</button>
    </form>
    <script>
      document.getElementById("resume").addEventListener("change", (e) => {
        document.getElementById("resume-name").textContent = e.target.files[0]?.name ?? "";
      });
    </script>
  </body>
</html>
