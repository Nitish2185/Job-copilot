name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build extension (Chrome/Edge and Firefox)
        run: pnpm --filter @job-copilot/extension build

      - name: Release builds never include the test host or every-site access (spec 2.1, 2.2)
        run: |
          node scripts/check-release-build.mjs extension/.output/chrome-mv3
          node scripts/check-release-build.mjs extension/.output/firefox-mv2

      - name: Audit dependencies (fails on high or critical only)
        run: pnpm audit --audit-level=high

  e2e:
    name: End-to-end tests (Chromium with the extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @job-copilot/extension exec playwright install --with-deps chromium

      - name: Build the e2e extension and run Playwright (new headless mode)
        run: pnpm e2e

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: extension/test-results
          retention-days: 7

  go:
    name: Go vet, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crawler
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: crawler/go.mod
          cache-dependency-path: crawler/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Build
        run: go build -o bin/crawl ./cmd/crawl
